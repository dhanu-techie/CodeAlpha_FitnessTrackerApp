<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%" role="img" aria-label="Exercise workouts and training session tracker illustration">
  <defs>
    <linearGradient id="exBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="exWeightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="exBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="exFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="exShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#b45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="96" height="96" rx="24" fill="url(#exBgGrad)"/>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="none" stroke="#fde68a" stroke-width="1.5"/>

  <!-- Energy Burst Radiance Arcs -->
  <path d="M16 34 C 14 46, 14 56, 18 68" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M80 34 C 82 46, 82 56, 78 68" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Workout Kettlebell / Dumbbell Centerpiece -->
  <!-- Diagonal Dumbbell -->
  <g filter="url(#exShadow)" transform="translate(18, 20) rotate(15, 30, 30)">
    <!-- Dumbbell Bar -->
    <rect x="18" y="24" width="28" height="6" rx="3" fill="url(#exBarGrad)" stroke="#64748b" stroke-width="1"/>
    <!-- Knurling texture on grip -->
    <line x1="28" y1="24" x2="28" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <line x1="32" y1="24" x2="32" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <line x1="36" y1="24" x2="36" y2="30" stroke="#94a3b8" stroke-width="1"/>

    <!-- Left Weight Plates -->
    <rect x="12" y="15" width="6" height="24" rx="2" fill="url(#exWeightGrad)"/>
    <rect x="5" y="18" width="7" height="18" rx="2" fill="url(#exWeightGrad)"/>
    <rect x="1" y="21" width="4" height="12" rx="1.5" fill="#92400e"/>

    <!-- Right Weight Plates -->
    <rect x="46" y="15" width="6" height="24" rx="2" fill="url(#exWeightGrad)"/>
    <rect x="52" y="18" width="7" height="18" rx="2" fill="url(#exWeightGrad)"/>
    <rect x="59" y="21" width="4" height="12" rx="1.5" fill="#92400e"/>

    <!-- Plate Rim Highlight -->
    <line x1="14" y1="17" x2="14" y2="37" stroke="#fde68a" stroke-width="1" opacity="0.6"/>
    <line x1="48" y1="17" x2="48" y2="37" stroke="#fde68a" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Calorie / Energy Flame Indicator -->
  <g filter="url(#exShadow)" transform="translate(56, 50)">
    <path d="M12 28 C 19 28, 24 22, 24 16 C 24 10, 18 6, 17 0 C 13 4, 10 9, 10 13 C 10 9, 7 7, 5 9 C 2 12, 0 16, 0 20 C 0 25, 5 28, 12 28 Z" fill="url(#exFlameGrad)"/>
    <!-- Inner Core Flame -->
    <path d="M12 26 C 15 26, 17 23, 17 20 C 17 16, 13 13, 12 11 C 11 13, 8 16, 8 19 C 8 23, 9 26, 12 26 Z" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Action Sparks -->
  <circle cx="26" cy="18" r="2.5" fill="#ea580c"/>
  <circle cx="20" cy="24" r="1.5" fill="#f59e0b"/>
  <circle cx="78" cy="20" r="3" fill="#f59e0b"/>
  <circle cx="84" cy="28" r="2" fill="#d97706"/>
</svg>