<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%" role="img" aria-label="Daily activity and movement tracker illustration">
  <defs>
    <linearGradient id="actBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="actShoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="actAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="actShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#047857" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="96" height="96" rx="24" fill="url(#actBgGrad)"/>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="none" stroke="#a7f3d0" stroke-width="1.5"/>

  <!-- Motion Wave Arcs -->
  <path d="M18 68 C 28 62, 42 64, 58 56 C 68 50, 78 52, 84 46" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>

  <!-- Running Sneaker / Shoe Group -->
  <g filter="url(#actShadow)" transform="translate(18, 26)">
    <!-- Sole Cushion -->
    <path d="M4 36 C 14 36, 40 37, 56 32 C 58 31, 59 34, 56 38 C 42 41, 14 41, 4 41 C 1 41, 0 38, 4 36 Z" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <path d="M6 39 L54 35" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Shoe Upper Body -->
    <path d="M6 35 C 4 28, 7 20, 16 18 C 22 17, 26 21, 31 24 C 38 27, 46 29, 54 31 C 56 32, 56 34, 54 35 C 40 36, 16 36, 6 35 Z" fill="url(#actShoeGrad)"/>

    <!-- Heel Collar -->
    <path d="M12 19 C 14 14, 18 13, 22 16 L 24 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dynamic Shoe Swoosh Stripe -->
    <path d="M12 28 C 22 28, 34 25, 46 22" fill="none" stroke="#f0fdf4" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 30 C 26 30, 38 27, 48 24" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Laces -->
    <line x1="25" y1="21" x2="28" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="23" x2="32" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="33" y1="25" x2="36" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Step Marker Dots / Energy Sparkles -->
  <circle cx="76" cy="24" r="3.5" fill="#10b981"/>
  <circle cx="84" cy="30" r="2" fill="#34d399"/>
  <circle cx="16" cy="24" r="2.5" fill="#34d399"/>
  <circle cx="72" cy="68" r="4" fill="#059669"/>
  <circle cx="81" cy="73" r="2.5" fill="#10b981"/>
</svg>