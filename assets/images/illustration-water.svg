<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%" role="img" aria-label="Water intake and hydration tracker illustration">
  <defs>
    <linearGradient id="watBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="watBottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="watDropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="watShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="96" height="96" rx="24" fill="url(#watBgGrad)"/>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="none" stroke="#bae6fd" stroke-width="1.5"/>

  <!-- Water Ripple Concentric Arcs -->
  <path d="M16 74 C 30 78, 66 78, 80 74" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 81 C 36 84, 60 84, 72 81" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Fitness Water Bottle -->
  <g filter="url(#watShadow)" transform="translate(26, 16)">
    <!-- Cap Loop / Handle -->
    <path d="M18 6 C 18 2, 26 2, 26 6 L 26 10 L 18 10 Z" fill="#0369a1"/>
    <!-- Bottle Cap -->
    <rect x="14" y="10" width="16" height="6" rx="2" fill="#0284c7"/>
    <!-- Bottle Neck -->
    <rect x="16" y="16" width="12" height="4" fill="#0ea5e9"/>
    
    <!-- Bottle Body -->
    <rect x="10" y="20" width="24" height="42" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    
    <!-- Liquid Water Fill Inside -->
    <path d="M11 36 Q 16 34, 22 36 T 33 36 L 33 56 C 33 59, 31 61, 28 61 L 16 61 C 13 61, 11 59, 11 56 Z" fill="url(#watBottleGrad)"/>

    <!-- Measurement Markings -->
    <line x1="28" y1="28" x2="31" y2="28" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26" y1="34" x2="31" y2="34" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="40" x2="31" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="26" y1="46" x2="31" y2="46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="52" x2="31" y2="52" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Highlight Reflection on Bottle -->
    <path d="M14 24 L 14 56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Large Refreshing Water Droplet -->
  <g filter="url(#watShadow)" transform="translate(56, 32)">
    <path d="M12 0 C 12 0, 24 14, 24 20 A 12 12 0 1 1 0 20 C 0 14, 12 0, 12 0 Z" fill="url(#watDropGrad)"/>
    <!-- Droplet Glint -->
    <path d="M7 16 A 5 5 0 0 1 12 11" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Tiny Floating Bubbles -->
  <circle cx="20" cy="38" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="16" cy="28" r="2" fill="#7dd3fc" opacity="0.9"/>
  <circle cx="78" cy="22" r="3.5" fill="#0ea5e9"/>
  <circle cx="84" cy="32" r="2" fill="#38bdf8"/>
</svg>