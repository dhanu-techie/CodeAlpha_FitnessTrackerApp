<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%" role="img" aria-label="Sleep duration and restful recovery tracker illustration">
  <defs>
    <linearGradient id="slpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="slpMoonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="slpPillowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="slpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.25"/>
    </filter>
    <filter id="slpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="96" height="96" rx="24" fill="url(#slpBgGrad)"/>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="none" stroke="#ddd6fe" stroke-width="1.5"/>

  <!-- Soft Night Rest Pillow / Cloud Base -->
  <g filter="url(#slpShadow)" transform="translate(18, 44)">
    <path d="M6 14 C 6 6, 16 2, 30 2 C 44 2, 54 6, 54 14 C 54 22, 44 26, 30 26 C 16 26, 6 22, 6 14 Z" fill="url(#slpPillowGrad)" stroke="#c7d2fe" stroke-width="1.5"/>
    <!-- Pillow Tuft Indent -->
    <path d="M22 14 Q 30 18, 38 14" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="30" cy="15" r="2.5" fill="#818cf8"/>
  </g>

  <!-- Glowing Crescent Moon -->
  <g filter="url(#slpShadow)" transform="translate(34, 14)">
    <path d="M28 2 C 16 2, 8 12, 8 24 C 8 36, 18 46, 32 46 C 36 46, 40 45, 44 43 C 34 43, 26 35, 26 24 C 26 13, 33 6, 42 4 C 38 2.5, 33 2, 28 2 Z" fill="url(#slpMoonGrad)"/>
    <!-- Moon highlight glint -->
    <circle cx="20" cy="18" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Twinkling Night Stars -->
  <!-- Star 1 (Top Left) -->
  <path d="M22 18 L 24 23 L 29 23 L 25 26 L 27 31 L 22 28 L 17 31 L 19 26 L 15 23 L 20 23 Z" fill="#fbbf24" transform="scale(0.65) translate(8, 6)"/>
  
  <!-- Star 2 (Top Right) -->
  <path d="M78 22 L 79 25 L 82 25 L 80 27 L 81 30 L 78 28 L 75 30 L 76 27 L 74 25 L 77 25 Z" fill="#6366f1" opacity="0.85"/>

  <!-- Star 3 (Middle Right) -->
  <circle cx="82" cy="40" r="2.5" fill="#fde047"/>

  <!-- Star 4 (Bottom Left) -->
  <circle cx="16" cy="48" r="2" fill="#818cf8"/>

  <!-- Zzz Gentle Sleep Rhythm -->
  <text x="68" y="24" fill="#6366f1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Z</text>
  <text x="76" y="16" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700">z</text>
  <text x="82" y="10" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" font-weight="700">z</text>
</svg>